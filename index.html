<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GmedranoTIC 360 Tour Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1c1917; color: white; }
        #root { height: 100vh; width: 100vw; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #44403c; border-radius: 10px; }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1c1917; display: flex; align-items: center; justify-content: center;
            z-index: 9999; flex-direction: column; gap: 20px;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(146, 64, 14, 0.1);
            border-left-color: #92400e; border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "three": "https://esm.sh/three@0.170.0",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-family: sans-serif; font-size: 14px; font-weight: bold; color: #d97706;">GmedranoTIC...</div>
    </div>
    <div id="root"></div>
    <script type="module">
        window.addEventListener('load', () => {
            const observer = new MutationObserver(() => {
                const root = document.getElementById('root');
                if (root && root.children.length > 0) {
                    const loader = document.getElementById('loader');
                    if (loader) loader.style.display = 'none';
                    observer.disconnect();
                }
            });
            observer.observe(document.getElementById('root'), { childList: true });
        });
    </script>
    <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
